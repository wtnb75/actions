name: python + uv sync
description: |
  install python and uv, then run `uv sync`
inputs:
  python-version:
    description: python version
    default: '3.x'
    required: false
  extra-args:
    description: extra arguments for `uv sync` (e.g. "--extra ssh")
    required: false
runs:
  using: "composite"
  steps:
  - id: setup-python
    name: setup python
    uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
    with:
      python-version: ${{ inputs.python-version }}
  - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
    with:
      enable-cache: true
  - name: uv sync
    run: uv sync $EXTRA_ARGS
    shell: bash
    env:
      EXTRA_ARGS: ${{ inputs.extra-args }}
outputs:
  python-version:
    description: python version string
    value: ${{ steps.setup-python.outputs.python-version }}
  python-path:
    description: python executable path
    value: ${{ steps.setup-python.outputs.python-path }}
  cache-hit:
    value: ${{ steps.setup-python.outputs.cache-hit }}
    description: cache hit or not

name: python + uv sync
description: |
  install python and uv, then run `uv sync`
inputs:
  python-version:
    description: python version
    default: '3.x'
    required: false
  extra-args:
    description: extra arguments for `uv sync` (e.g. "--extra ssh")
    required: false
runs:
  using: "composite"
  steps:
  - id: setup-python
    name: setup python
    uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
    with:
      python-version: ${{ inputs.python-version }}
  - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
    with:
      enable-cache: true
  - name: uv sync
    run: uv sync $EXTRA_ARGS
    shell: bash
    env:
      EXTRA_ARGS: ${{ inputs.extra-args }}
outputs:
  python-version:
    description: python version string
    value: ${{ steps.setup-python.outputs.python-version }}
  python-path:
    description: python executable path
    value: ${{ steps.setup-python.outputs.python-path }}
  cache-hit:
    value: ${{ steps.setup-python.outputs.cache-hit }}
    description: cache hit or not

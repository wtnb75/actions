name: cargo test + coverage
description: |
  run cargo test with coverage via cargo-llvm-cov
inputs:
  html-output-dir:
    description: coverage HTML report output directory
    default: coverage
    required: false
runs:
  using: "composite"
  steps:
  - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
    with:
      tool: cargo-llvm-cov
  - name: test + coverage
    run: |
      cargo llvm-cov --html --output-dir "$HTML_OUTPUT_DIR"
      find "$HTML_OUTPUT_DIR/html" -mindepth 1 -maxdepth 1 -exec mv -t "$HTML_OUTPUT_DIR" {} +
      rmdir "$HTML_OUTPUT_DIR/html"
      {
        echo "## coverage report"
        echo
        echo '```'
        cargo llvm-cov report
        echo '```'
      } >> "$GITHUB_STEP_SUMMARY"
    shell: bash
    env:
      HTML_OUTPUT_DIR: ${{ inputs.html-output-dir }}

name: golang setup + fmt/vet/lint
description: |
  setup go, then run gofmt/go vet/golangci-lint
inputs:
  go-version:
    description: go version
    default: stable
    required: false
runs:
  using: "composite"
  steps:
  - uses: actions/setup-go@v6
    with:
      go-version: ${{ inputs.go-version }}
      cache: true
  - name: gofmt
    shell: bash
    run: |
      fmt_out=$(gofmt -l .)
      if [ -n "$fmt_out" ]; then
        echo "The following files are not formatted:" >&2
        echo "$fmt_out" >&2
        exit 1
      fi
  - name: go vet
    run: go vet ./...
    shell: bash
  - uses: golangci/golangci-lint-action@v9

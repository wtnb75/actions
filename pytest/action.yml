name: pytest
description: |
  run pytest
inputs:
  test-readme:
    description: directory contains README.md to use pytest-readme
    required: false
  benchmark:
    description: use benchmark
    required: false
runs:
  using: "composite"
  steps:
  - name: pytest-readme
    if: inputs.test-readme != ''
    run: |
      if [ -f ${{ inputs.test-readme }}/README.md ] ; then
        echo 'from pytest_readme import setup' > ${{ inputs.test-readme }}/conftest.py
        echo 'setup()' >> ${{ inputs.test-readme }}/conftest.py
      fi
    shell: bash
  - name: test
    run: PYTHONPATH=. uv run pytest -xs
    shell: bash
  - name: summary
    run: uv run coverage report --format markdown --omit tests >> $GITHUB_STEP_SUMMARY
    shell: bash
  - name: diff coverage
    shell: bash
    run: |
      git fetch origin ${{ github.event.repository.default_branch }}
      git diff origin/${{ github.event.repository.default_branch }}..${{ github.ref_name}} > diff-cover.diff
      uv run coverage xml
      uv run --with diff-cover diff-cover coverage.xml --diff-file diff-cover.diff --markdown-report report.md
      cat report.md >> $GITHUB_STEP_SUMMARY
    if: github.ref_name != github.event.repository.default_branch
  - name: coverage data
    uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
    with:
      name: coverage
      path: |
        .coverage
        cover
        coverage.xml

name: gomod update
description: |
  update go.mod/go.sum and make PR
inputs:
  github-token:
    description: github token
    default: ${{ github.token }}
    required: false
  go-test-args:
    description: "if set, run `go test <args>` after update; PR is skipped when the test fails"
    required: false
  reviewers:
    description: "comma or newline separated GitHub usernames to request as PR reviewers"
    default: ${{ github.repository_owner }}
    required: false
  branch:
    description: "PR branch name"
    default: chore/update-deps
    required: false
runs:
  using: "composite"
  steps:
  - name: snapshot dependencies (before)
    continue-on-error: true
    run: |
      ${{ github.action_path }}/../tools/dep-diff.sh snapshot go > "$RUNNER_TEMP/deps-before.next.txt"
      mv "$RUNNER_TEMP/deps-before.next.txt" "$RUNNER_TEMP/deps-before.txt"
    shell: bash
  - run: go get -u ./...
    shell: bash
  - run: go mod tidy
    shell: bash
  - name: test
    if: inputs.go-test-args != ''
    run: go test $GO_TEST_ARGS
    shell: bash
    env:
      GO_TEST_ARGS: ${{ inputs.go-test-args }}
  - name: build PR body
    continue-on-error: true
    run: |
      tool=${{ github.action_path }}/../tools/dep-diff.sh
      tmp=$RUNNER_TEMP
      "$tool" fallback "Go module updates" > "$tmp/pr-body.md"
      "$tool" snapshot go > "$tmp/deps-after.txt"
      "$tool" diff "$tmp/deps-before.txt" "$tmp/deps-after.txt" "Go module updates" > "$tmp/pr-body.next.md"
      mv "$tmp/pr-body.next.md" "$tmp/pr-body.md"
    shell: bash
  - name: Create PR
    uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
    with:
      token: ${{ inputs.github-token }}
      commit-message: Update Dependencies
      title: 'auto update dependencies'
      body-path: ${{ runner.temp }}/pr-body.md
      branch: ${{ inputs.branch }}
      delete-branch: true
      reviewers: ${{ inputs.reviewers }}
      add-paths: |
        go.mod
        go.sum

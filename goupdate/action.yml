name: gomod update
description: |
  update go.mod/go.sum and make PR
inputs:
  github-token:
    description: github token
    default: ${{ github.token }}
    required: true
  go-test-args:
    description: "if set, run `go test <args>` after update; PR is skipped when the test fails"
    required: false
  reviewers:
    description: "comma or newline separated GitHub usernames to request as PR reviewers"
    default: ${{ github.repository_owner }}
    required: false
runs:
  using: "composite"
  steps:
  - run: go get -u
    shell: bash
  - run: go mod tidy
    shell: bash
  - uses: wtnb75/actions/pinact@v1
  - name: test
    if: inputs.go-test-args != ''
    run: go test ${{ inputs.go-test-args }}
    shell: bash
  - name: Create PR
    uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
    with:
      token: ${{ inputs.github-token }}
      commit-message: Update Dependencies
      title: 'auto update dependencies'
      branch: chore/update-deps
      delete-branch: true
      reviewers: ${{ inputs.reviewers }}
      add-paths: |
        go.mod
        go.sum
        .github/workflows/*.yml

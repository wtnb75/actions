name: docker
description: |
  build docker image and push to registry
inputs:
  username:
    description: docker username
    required: true
    default: ${{ github.actor }}
  password:
    description: docker password
    required: true
  registry:
    description: registry hostname
    default: ghcr.io
  image-name:
    description: image name
    required: true
    default: ${{ github.repository }}
  image-version:
    description: set label
    required: false
  context:
    description: context directory
    required: true
  build-args:
    description: build args
    required: false
  platforms:
    description: image platforms
    default: linux/amd64,linux/arm64
  push:
    description: push
    default: 'false'
  file:
    description: dockerfile
    required: false
outputs:
  imageid:
    description: image id
    value: ${{ steps.docker-build.outputs.imageid }}
  digest:
    description: image digest
    value: ${{ steps.docker-build.outputs.digest }}
  metadata:
    description: build metadata
    value: ${{ steps.docker-build.outputs.metadata }}
  image-name:
    description: image name to pull
    value: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ steps.tag.outputs.tag }}
runs:
  using: "composite"
  steps:
  - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
  - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
  - name: login to container registry
    if: inputs.password != ''
    uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
    with:
      registry: ${{ inputs.registry }}
      username: ${{ inputs.username }}
      password: ${{ inputs.password }}
  - name: tag version
    if: inputs.image-version != ''
    shell: bash
    run: |
      echo LABEL org.opencontainers.image.version=\"${{ inputs.image-version }}\" >> ${{ inputs.context }}/Dockerfile
  - id: tag
    name: sanitize ref name for docker tag
    shell: bash
    run: |
      tag=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_.-]#-#g')
      echo "tag=$tag" >> "$GITHUB_OUTPUT"
  - id: docker-build
    name: build and push
    uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
    with:
      context: ${{ inputs.context }}
      file: ${{ inputs.file }}
      build-args: ${{ inputs.build-args }}
      push: ${{ inputs.push }}
      platforms: ${{ inputs.platforms }}
      labels: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.authors=${{ github.repository_owner }}
        org.opencontainers.image.base.name=${{ inputs.registry }}/${{ inputs.image-name }}:${{ github.ref_name }}
      tags: |
        ${{ inputs.registry }}/${{ inputs.image-name }}:${{ steps.tag.outputs.tag }}
        ${{ inputs.registry }}/${{ inputs.image-name }}:latest
  - name: summary
    run: |
      cat <<EOF >> $GITHUB_STEP_SUMMARY
        - docker pull ${{ inputs.registry }}/${{ inputs.image-name }}:${{ github.ref_name }}
        - image-id: ${{ steps.docker-build.outputs.imageid }}
      EOF
    shell: bash

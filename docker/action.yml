name: docker
description: |
  build docker image and push to registry
inputs:
  username:
    description: docker username
    required: true
    default: ${{ github.actor }}
  password:
    description: docker password
    required: true
  registry:
    description: registry hostname
    default: ghcr.io
  image-name:
    description: image name
    required: true
    default: ${{ github.repository }}
  image-version:
    description: set label
    required: false
  context:
    description: context directory
    required: true
  build-args:
    description: build args
    required: false
  platforms:
    description: image platforms
    default: linux/amd64,linux/arm64
  push:
    description: push
    default: 'false'
  file:
    description: dockerfile
    required: false
outputs:
  imageid:
    description: image id
    value: ${{ steps.docker-build.outputs.imageid }}
  digest:
    description: image digest
    value: ${{ steps.docker-build.outputs.digest }}
  metadata:
    description: build metadata
    value: ${{ steps.docker-build.outputs.metadata }}
  image-name:
    description: image name to pull
    value: ${{ steps.tag.outputs.ref }}:${{ steps.tag.outputs.tag }}
runs:
  using: "composite"
  steps:
  - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
  - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
  - name: login to container registry
    if: inputs.password != ''
    uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
    with:
      registry: ${{ inputs.registry }}
      username: ${{ inputs.username }}
      password: ${{ inputs.password }}
  - id: tag
    name: sanitize ref name and image name for docker tag
    shell: bash
    run: |
      tag=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_.-]#-#g')
      image=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
      echo "tag=$tag" >> "$GITHUB_OUTPUT"
      echo "image=$image" >> "$GITHUB_OUTPUT"
      echo "ref=$REGISTRY/$image" >> "$GITHUB_OUTPUT"
    env:
      IMAGE_NAME: ${{ inputs.image-name }}
      REGISTRY: ${{ inputs.registry }}
  - id: docker-build
    name: build and push
    uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
    with:
      context: ${{ inputs.context }}
      file: ${{ inputs.file }}
      build-args: ${{ inputs.build-args }}
      push: ${{ inputs.push }}
      platforms: ${{ inputs.platforms }}
      labels: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.authors=${{ github.repository_owner }}
        org.opencontainers.image.base.name=${{ steps.tag.outputs.ref }}:${{ steps.tag.outputs.tag }}
        ${{ inputs.image-version != '' && format('org.opencontainers.image.version={0}', inputs.image-version) || '' }}
      tags: |
        ${{ steps.tag.outputs.ref }}:${{ steps.tag.outputs.tag }}
        ${{ steps.tag.outputs.ref }}:latest
  - name: summary
    run: |
      cat <<EOF >> $GITHUB_STEP_SUMMARY
        - docker pull $REF:${{ steps.tag.outputs.tag }}
        - image-id: ${{ steps.docker-build.outputs.imageid }}
      EOF
    shell: bash
    env:
      REF: ${{ steps.tag.outputs.ref }}

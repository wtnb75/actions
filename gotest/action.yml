name: go test + coverage
description: |
  run go test with coverage, optionally with extra build tags
inputs:
  tags:
    description: "space-separated build tags to test additionally (e.g. 'wasmer wasmtime docker wazero')"
    required: false
  html-output-dir:
    description: coverage HTML report output directory
    default: coverage
    required: false
runs:
  using: "composite"
  steps:
  - name: test (default)
    run: go test -v ./... -coverprofile=cover.out -covermode=atomic -coverpkg=./... -json > report.json
    shell: bash
  - name: test (extra build tags)
    if: inputs.tags != ''
    shell: bash
    run: |
      for t in $TAGS; do
        go test -tags "$t" -v ./... -coverprofile=cover.out.$t -covermode=atomic -coverpkg=./... -json >> report.json
        tail -q -n +2 cover.out.$t >> cover.out
      done
    env:
      TAGS: ${{ inputs.tags }}
  - uses: becheran/go-testreport@90efc1ce13c872f23d6bc8a069527c26288b8f9c # v0.3.2
    with:
      input: report.json
  - name: coverage summary
    shell: bash
    run: |
      {
        echo "## coverage report"
        echo
        echo '```'
        go tool cover -func=cover.out
        echo '```'
      } >> "$GITHUB_STEP_SUMMARY"
  - name: coverage html
    shell: bash
    run: |
      mkdir -p "$HTML_OUTPUT_DIR"
      go tool cover -html=cover.out -o "$HTML_OUTPUT_DIR/index.html"
    env:
      HTML_OUTPUT_DIR: ${{ inputs.html-output-dir }}

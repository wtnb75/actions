name: wheel
description: |
  build python package by calling `uv build --wheel`
inputs:
  output-dir:
    description: output directory
    default: dist
    required: false
outputs:
  filename:
    description: result file name
    value: ${{ steps.wheel-build.outputs.file }}
  hash:
    description: result file hash
    value: ${{ steps.wheel-build.outputs.hash }}
runs:
  using: "composite"
  steps:
  - id: wheel-build
    name: build
    run: |
      tmpd=$(mktemp -d)
      mkdir -p "$OUTPUT_DIR"
      uv build --wheel -o "$tmpd"
      file=$(ls -1 "$tmpd" | grep '\.whl$')
      count=$(echo "$file" | grep -c .)
      if [ "$count" -ne 1 ]; then
        echo "::error::expected exactly one .whl file in $tmpd, found $count" >&2
        exit 1
      fi
      echo "file=$file" >> "$GITHUB_OUTPUT"
      echo "hash=sha256:$(sha256sum "$tmpd/$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      cp "$tmpd/$file" "$OUTPUT_DIR"/
      rm -rf "$tmpd"
    shell: bash
    env:
      OUTPUT_DIR: ${{ inputs.output-dir }}
  - name: summary
    run: |
      uv run --with pkginfo python ${{ github.action_path }}/wheel2md.py \
        "$OUTPUT_DIR/${{ steps.wheel-build.outputs.file }}" \
        -a $GITHUB_STEP_SUMMARY
    shell: bash
    env:
      OUTPUT_DIR: ${{ inputs.output-dir }}
  - name: wheel artifact
    uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
    with:
      name: wheel
      path: ${{ inputs.output-dir }}/${{ steps.wheel-build.outputs.file }}

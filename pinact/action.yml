name: pinact
description: |
  pin github actions references to SHA (and update existing pins to latest)
runs:
  using: "composite"
  steps:
  - name: install pinact
    run: go install github.com/suzuki-shunsuke/pinact/v3/cmd/pinact@latest
    shell: bash
  - name: pin actions to SHA
    run: pinact run -u
    shell: bash
    env:
      GITHUB_TOKEN: ${{ github.token }}

name: python deps update
description: |
  update uv.lock and make PR
inputs:
  github-token:
    description: github token
    default: ${{ github.token }}
    required: false
  test-args:
    description: "if set, run `uv run pytest <args>` after update; PR is skipped when the test fails"
    required: false
  dirs:
    required: false
    description: directories to ruff-check/format
    default: .
  reviewers:
    description: "comma or newline separated GitHub usernames to request as PR reviewers"
    default: ${{ github.repository_owner }}
    required: false
  branch:
    description: "PR branch name"
    default: chore/update-deps
    required: false
runs:
  using: "composite"
  steps:
  - name: snapshot dependencies (before)
    continue-on-error: true
    run: |
      ${{ github.action_path }}/../tools/dep-diff.sh snapshot toml uv.lock > "$RUNNER_TEMP/deps-before.next.txt"
      mv "$RUNNER_TEMP/deps-before.next.txt" "$RUNNER_TEMP/deps-before.txt"
    shell: bash
  - run: uv lock --upgrade
    shell: bash
  - name: ruff check
    run: uv run ruff check --output-format=github $DIRS
    shell: bash
    env:
      DIRS: ${{ inputs.dirs }}
  - name: ruff format check
    run: uv run ruff format --check --diff $DIRS
    shell: bash
    env:
      DIRS: ${{ inputs.dirs }}
  - name: test
    if: inputs.test-args != ''
    run: uv run pytest $TEST_ARGS
    shell: bash
    env:
      TEST_ARGS: ${{ inputs.test-args }}
  - name: build PR body
    continue-on-error: true
    run: |
      tool=${{ github.action_path }}/../tools/dep-diff.sh
      "$tool" fallback "Python dependency updates" > "$RUNNER_TEMP/pr-body.md"
      "$tool" snapshot toml uv.lock > "$RUNNER_TEMP/deps-after.txt"
      "$tool" diff "$RUNNER_TEMP/deps-before.txt" "$RUNNER_TEMP/deps-after.txt" "Python dependency updates" > "$RUNNER_TEMP/pr-body.next.md"
      mv "$RUNNER_TEMP/pr-body.next.md" "$RUNNER_TEMP/pr-body.md"
    shell: bash
  - name: Create PR
    uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
    with:
      token: ${{ inputs.github-token }}
      commit-message: Update Python Dependencies
      title: 'auto update dependencies'
      body-path: ${{ runner.temp }}/pr-body.md
      branch: ${{ inputs.branch }}
      delete-branch: true
      reviewers: ${{ inputs.reviewers }}
      add-paths: |
        uv.lock

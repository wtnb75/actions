name: pypi upload
description: upload file to pypi
inputs:
  username:
    description: pypi username (use `__token__` when authenticating with an API token)
    required: false
    default: __token__
  password:
    description: pypi password (or API token value when username is `__token__`)
    required: true
  repository_url:
    description: pypi url
    default: https://upload.pypi.org/legacy/
  file:
    description: upload file
    required: true
runs:
  using: "composite"
  steps:
  - name: deploy to pypi
    run: uv publish "$INPUT_FILE"
    shell: bash
    env:
      UV_PUBLISH_USERNAME: ${{ inputs.username }}
      UV_PUBLISH_PASSWORD: ${{ inputs.password }}
      UV_PUBLISH_URL: ${{ inputs.repository_url }}
      INPUT_FILE: ${{ inputs.file }}

name: rust deps update
description: |
  upgrade Cargo.toml dependency versions and make PR
inputs:
  github-token:
    description: github token
    default: ${{ github.token }}
    required: false
  test-args:
    description: "if set, run `cargo test $TEST_ARGS` after update; PR is skipped when the test fails"
    required: false
  reviewers:
    description: "comma or newline separated GitHub usernames to request as PR reviewers"
    default: ${{ github.repository_owner }}
    required: false
  branch:
    description: "PR branch name"
    default: chore/update-deps
    required: false
runs:
  using: "composite"
  steps:
  - name: snapshot dependencies (before)
    continue-on-error: true
    run: |
      ${{ github.action_path }}/../tools/dep-diff.sh snapshot toml Cargo.lock > "$RUNNER_TEMP/deps-before.next.txt"
      mv "$RUNNER_TEMP/deps-before.next.txt" "$RUNNER_TEMP/deps-before.txt"
    shell: bash
  - run: cargo install cargo-edit --version 0.13.13 --locked
    shell: bash
  - run: cargo upgrade --incompatible allow
    shell: bash
  - name: test
    if: inputs.test-args != ''
    run: cargo test $TEST_ARGS
    shell: bash
    env:
      TEST_ARGS: ${{ inputs.test-args }}
  - name: build PR body
    continue-on-error: true
    run: |
      tool=${{ github.action_path }}/../tools/dep-diff.sh
      tmp=$RUNNER_TEMP
      "$tool" fallback "Rust dependency updates" > "$tmp/pr-body.md"
      "$tool" snapshot toml Cargo.lock > "$tmp/deps-after.txt"
      "$tool" diff "$tmp/deps-before.txt" "$tmp/deps-after.txt" "Rust dependency updates" > "$tmp/pr-body.next.md"
      mv "$tmp/pr-body.next.md" "$tmp/pr-body.md"
    shell: bash
  - name: Create PR
    uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
    with:
      token: ${{ inputs.github-token }}
      commit-message: Update Rust Dependencies
      title: 'auto update dependencies'
      body-path: ${{ runner.temp }}/pr-body.md
      branch: ${{ inputs.branch }}
      delete-branch: true
      reviewers: ${{ inputs.reviewers }}
      add-paths: |
        Cargo.toml
        Cargo.lock

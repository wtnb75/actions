name: actions-validator
on:
  push: {}
jobs:
  actions-validator:
    name: validate actions file
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./action-validator
      with:
        files: "*/action.yml .github/workflows/*.yml"

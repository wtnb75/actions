name: test golang related actions
on:
  push: {}
  workflow_dispatch: {}
jobs:
  golang:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: mv -f _go.test/* .
      shell: bash
    - uses: ./golang
    - uses: ./gotest
      with:
        tags: demo

  goupdate-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: mv -f _go.test/* .
      shell: bash
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: true
    - uses: ./goupdate
      with:
        go-test-args: "./..."

  gofix-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: move fixture into place on a synced scratch branch
      shell: bash
      run: |
        mv -f _go.test/* .
        git config user.name github-actions
        git config user.email github-actions@github.com
        git checkout -b _gofix-check-scratch
        git add -A
        git commit -m "test: move dummy fixture into place"
        git push -f origin _gofix-check-scratch
    - uses: ./golang
    - uses: ./gofix
      with:
        go-test-args: "./..."

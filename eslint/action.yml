name: eslint
description: |
  lint by eslint (via `pnpm run lint`)
inputs:
  working-directory:
    description: directory containing package.json
    default: "."
    required: false
runs:
  using: "composite"
  steps:
  - name: lint
    run: pnpm run lint
    shell: bash
    working-directory: ${{ inputs.working-directory }}

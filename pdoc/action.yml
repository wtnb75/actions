name: pdoc
description: |
  run pdoc
inputs:
  output-dir:
    description: output directory
    required: true
  module:
    description: module to document
    required: true
  other-options:
    description: other option to pdoc
    required: false
runs:
  using: "composite"
  steps:
  - name: generate
    run: uv run pdoc -o "$OUTPUT_DIR" "$MODULE" $OTHER_OPTIONS
    shell: bash
    env:
      OUTPUT_DIR: ${{ inputs.output-dir }}
      MODULE: ${{ inputs.module }}
      OTHER_OPTIONS: ${{ inputs.other-options }}
  - name: document data
    uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
    with:
      name: pdoc
      path: ${{ inputs.output-dir }}
